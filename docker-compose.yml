services:
  smartcampus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_campus_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=griet_intelligent_campus_secret_2026
      - MODEL=gemini-1.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VITE_OPENWEATHER_API_KEY=${VITE_OPENWEATHER_API_KEY:-}
      - VITE_MAPTILER_KEY=${VITE_MAPTILER_KEY:-}
    restart: unless-stopped
