services:
  - type: web
    name: smart-campus-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_OPENWEATHER_API_KEY
        sync: false
      - key: VITE_MAPTILER_KEY
        sync: false
